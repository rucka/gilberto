name: Bootstrap smoke

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: smoke (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
          run_install: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack and install globally
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/npm-prefix"
          (cd apps/cli && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
          (cd packages/vault-bootstrap && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
          npm i -g --prefix "$RUNNER_TEMP/npm-prefix" "$RUNNER_TEMP"/pack/*.tgz
          # workspace CLI is 0.0.0; stamp an in-range version so the #48 skill accepts it
          (cd "$RUNNER_TEMP/npm-prefix/lib/node_modules/gilberto" && npm pkg set version=0.1.0-smoke)
          echo "$RUNNER_TEMP/npm-prefix/bin" >> "$GITHUB_PATH"

      - name: Smoke (no-launchd, no-hooks)
        run: bash apps/cli/test/smoke/bootstrap.sh base

      - name: Smoke (Path A skill vs Path B tree diff)
        run: bash apps/cli/test/smoke/bootstrap.sh path-a

      - name: Smoke (macOS launchd)
        if: runner.os == 'macOS'
        run: bash apps/cli/test/smoke/bootstrap.sh launchd

      - name: Cleanup launchd residue
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$HOME/Library/LaunchAgents/com.foomakers.gilberto.morning-briefing.plist" \
                "$HOME/Library/LaunchAgents/com.foomakers.gilberto.reflect-day.plist"
