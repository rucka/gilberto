name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.changeset/**'
  push:
    branches:
      - main
    paths-ignore:
      - '.changeset/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: tools/skill-tests/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate (verify-only)
        run: pnpm quality-gate:ci

      - name: Pack check
        run: node scripts/release-check.js && pnpm build && node scripts/pack-check.js
