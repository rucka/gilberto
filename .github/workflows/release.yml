name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g., v0.1.0-alpha)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Quality, build, publish, release
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.33.2'
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate
        run: pnpm quality-gate:ci

      - name: Build
        run: pnpm build

      - name: Pack check
        run: node scripts/pack-check.js

      - name: Assert prerelease tag is next
        run: |
          tag="$(node -p "require('./.changeset/pre.json').tag")"
          if [ "$tag" != "next" ]; then
            echo "::error::.changeset/pre.json tag is '$tag', expected 'next' — refusing to publish"
            exit 1
          fi

      - name: Read published version
        id: version
        run: echo "version=$(node -p "require('./apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Detect NPM_TOKEN presence
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "HAS_NPM_TOKEN=true" >> "$GITHUB_ENV"
          else
            echo "HAS_NPM_TOKEN=false" >> "$GITHUB_ENV"
          fi

      - name: Publish to npm
        id: publish
        if: env.HAS_NPM_TOKEN == 'true'
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish --tag next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Warn — NPM_TOKEN missing
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "::warning::NPM_TOKEN not configured — skipping npm publish. GitHub Release still created."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --target "$TARGET_SHA"

  smoke:
    name: Smoke (${{ matrix.os }}, node ${{ matrix.node }})
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: npx gilberto@next --version
        env:
          EXPECTED: ${{ needs.release.outputs.version }}
        run: |
          for i in 1 2 3 4 5 6; do
            out="$(npx --yes gilberto@next --version)" && [ "$out" = "$EXPECTED" ] && exit 0
            echo "attempt $i: got '${out:-}', expected '$EXPECTED'"
            sleep 20
          done
          exit 1
