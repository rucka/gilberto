[project]
name = "skill-tests"
version = "0.0.0"
description = "pytest harness for skill tests"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "../../plugins"]
python_files = ["test_*.py"]
addopts = "--cov --cov-report=html:coverage/html --cov-report=xml:coverage/coverage.xml"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/tests/*", ".venv/*"]
